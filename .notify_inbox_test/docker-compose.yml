version: '3'

networks:
  internal:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: .notify_inbox_test/Dockerfile
      args:
        RAILS_ENV: ${RAILS_ENV}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - internal
    ports:
      - ${WEB_PORT}:3000
    depends_on:
      - db
    command: >
      sh -c "until pg_isready -h ${DB_HOST} -U ${POSTGRES_USER};
             do echo 'waiting for db...'; sleep 2; done
             && bin/rails db:prepare
             && bin/rails server -b 0.0.0.0"

volumes:
  db:
