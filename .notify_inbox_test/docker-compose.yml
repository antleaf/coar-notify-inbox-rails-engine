networks:
  internal:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${DOCKER_VOLUMES_PATH_PREFIX:-}db:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: .notify_inbox_test/Dockerfile
      args:
        RAILS_ENV: ${RAILS_ENV:-production}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    expose:
      - 3000
    ports:
      - ${WEB_PORT:-3001}:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "bin/rails db:prepare &&
             bin/rails server -b 0.0.0.0"

volumes:
  db:
